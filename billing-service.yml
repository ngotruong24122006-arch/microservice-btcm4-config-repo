# Cấu hình riêng của billing-service
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/billing_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  kafka:
    consumer:
      group-id: billing-service

app:
  billing:
    # Hạn thanh toán hóa đơn (phút) - khớp thời gian giữ chỗ của appointment-service
    payment-window-minutes: 15
