# Cấu hình riêng của identity-service
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/identity_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  admin:
    # Tài khoản ADMIN tự tạo khi khởi động lần đầu
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@123}
    email: ${ADMIN_EMAIL:admin@telehealth.local}
