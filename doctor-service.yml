spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/doctor_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  cache:
    # Thời gian sống (phút) của cache bác sĩ trong Redis
    doctor-ttl-minutes: ${DOCTOR_CACHE_TTL_MINUTES:10}
